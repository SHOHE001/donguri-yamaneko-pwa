name: Blocker
description: 3回の意味ある試行が失敗した未解決問題を記録する。
labels:
  - blocked
body:
  - type: markdown
    attributes:
      value: 秘密情報・token・個人情報を貼らないでください。既存Issueを先に検索してください。
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
