    validations:
      required: true
  - type: textarea
    id: attempt2
    attributes:
      label: Attempt 2
      description: Hypothesis / Change or verification / Result
    validations:
      required: true
  - type: textarea
    id: attempt3
    attributes:
      label: Attempt 3
      description: Hypothesis / Change or verification / Result
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Branch, commit, environment, reproduction, and next steps
    validations:
      required: true

