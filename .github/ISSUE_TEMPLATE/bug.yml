name: Bug report
description: 不具合と再現手順を記録する。
body:
  - type: markdown
    attributes:
      value: 秘密情報・token・個人情報を貼らないでください。既存Issueを先に検索してください。
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
  - type: textarea
    id: context
    attributes:
      label: Additional context

